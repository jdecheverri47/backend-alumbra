  Cursos certificados de una persona (la propia persona, líderes y pastores).
  """
  courseCompletions(userId: ID!): [CourseCompletion!]!

  """Certificaciones de un curso, para marcar aprobados en una cohorte."""
  courseCompletionsByCourse(courseId: ID!): [CourseCompletion!]!

  """Cursos con su currículo (temas → clases → tareas)."""
  courses: [Course!]!

  """Eventos visibles para mí en el rango [from, to]."""
  events(from: DateTime!, to: DateTime!): [Event!]!

  """Feed principal, más reciente primero."""
  feed(audience: FeedAudience! = ALL, pagination: PaginationInput): PostConnection!
  group(id: ID!): Group!
  groupSession(id: ID!): GroupSession!

  """Clases de un grupo, más reciente primero."""
  groupSessions(groupId: ID!): [GroupSession!]!

  """Clases de mis grupos que tocan el rango (para el calendario)."""
  groupSessionsInRange(from: DateTime!, to: DateTime!): [GroupSession!]!

  """Todos los grupos (solo pastores)."""
  groups(includeArchived: Boolean! = false): [Group!]!
  instituteGradebook: InstituteGradebook!
  instituteModules: [InstituteModule!]!
  instituteRoster: [InstituteEnrollment!]!

  """Cada alumno con su entrega de esta tarea. Profesores."""
  instituteSubmissions(itemId: ID!): [InstituteSubmission!]!

  """Observaciones del filtro (pastores)."""
  journeyObservations(journeyId: ID!): [ChurchObservation!]!

  """The currently authenticated user."""
  me: User!

  """Proceso de una persona (pastor, entrevistador o la propia persona)."""
  membershipJourneyOf(userId: ID!): MembershipJourney

  """Tablero de candidatos (pastores)."""
  membershipJourneys(stage: JourneyStage): [MembershipJourney!]!
  ministries(includeArchived: Boolean! = false): [Ministry!]!
  ministry(slug: String!): Ministry

  """Candidatos asignados a mí como líder de ruta, pendientes de cohorte."""
  myAssignedCandidates: [MembershipJourney!]!

  """Mis inscripciones a cursos."""
  myCourseEnrollments: [CourseEnrollment!]!
  myFeedPermissions: FeedPermissions!

  """Grupos donde soy miembro activo o líder."""
  myGroups: [Group!]!

  """Qué puede hacer quien consulta."""
  myInstitute: InstituteAccess!

  """Procesos donde soy el entrevistador."""
  myInterviews: [MembershipJourney!]!

  """Mi proceso de membresía."""
  myJourney: MembershipJourney

  """Los ministerios en los que sirve quien consulta, con su rol."""
  myMinistries: [MinistryMembership!]!

  """Personas asignadas a quien consulta que todavía nadie ha contactado."""
  myPendingNewcomers: Int!
  newcomer(id: ID!): Newcomer!

  """Personas nuevas, lo más reciente primero."""
  newcomers(filter: NewcomerFilterInput): [Newcomer!]!

  """Inscritos pendientes de cohorte de un curso."""
  pendingCourseEnrollments(courseId: ID!): [CourseEnrollment!]!

  """Anuncios fijados, para mostrar arriba del feed."""
  pinnedAnnouncements(audience: FeedAudience! = ALL): [Post!]!

  """Comentarios de un post, más antiguo primero."""
  postComments(postId: ID!): [PostComment!]!

  """
  Eventos generales publicables en el rango [from, to]. No requiere sesión.
  """
  publicEvents(from: DateTime!, to: DateTime!): [PublicEvent!]!

  """Eventos generales publicables sin fecha definida. No requiere sesión."""
  publicUndatedEvents: [PublicEvent!]!

  """
  Cohortes de la Ruta con su estado. Pastores: todas; líderes: las suyas.
  """
  rutaCohorts: [RutaCohortOverview!]!

  """Eventos anunciados sin fecha definida, visibles para mí."""
  undatedEvents: [Event!]!
  user(id: ID!): User
  users(filter: UserFilterInput, pagination: PaginationInput): UserConnection!
}

type ReactionCount {
  count: Int!
  type: ReactionType!
}

enum ReactionType {
  AMEN
  LIKE
  LOVE
}

type RutaAssignmentTrace {
  submitted: Boolean!
  submittedAt: DateTime
  title: String!

  """Archivo entregado (si existe)."""
  url: String
}

"""Trazabilidad del candidato en una clase de la Ruta."""
type RutaClassTrace {
  assignments: [RutaAssignmentTrace!]!
  attended: Boolean!

  """Hora de ingreso registrada."""
  checkedInAt: DateTime

  """Clase del currículo que implementa."""
  lessonId: ID
  sessionId: ID!
  startsAt: DateTime!
  status: GroupSessionStatus!
  title: String
  topicTitle: String
}

"""Resumen de una cohorte de la Ruta para el tablero pastoral."""
type RutaCohortOverview {
  group: Group!

  """Clases del temario marcadas como completadas."""
  lessonsCompleted: Int!
  lessonsTotal: Int!
  nextSessionAt: DateTime
  nextSessionTitle: String

  """Aspirantes activos en la cohorte."""
  studentCount: Int!
}

type RutaProgress {
  assignmentsSubmitted: Int!
  assignmentsTotal: Int!
  classes: [RutaClassTrace!]!
  sessionsAttended: Int!

  """Clases no canceladas de la cohorte."""
  sessionsTotal: Int!
}

